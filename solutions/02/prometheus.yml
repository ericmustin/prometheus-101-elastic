# Prometheus 101
#
# This is the Prometheus configuration you edit. Every chapter changes it or
# something next to it.
#
# After every edit:  make apply
# To check yourself: make test

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus exposes its own metrics on /metrics, exactly like anything else
  # it scrapes. There is nothing special about this job.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
